# Example GitHub Actions pipeline for TestGoblin.
#
# Two tiers, both running the SAME test suite — only TestRunConfig changes
# (via TESTGOBLIN_* env vars), which is the whole payoff of the config layer:
#
#   1. PR smoke   — fast, cheap, no device farm. Runs the edit/play-mode tests
#                   in the Unity editor (batch mode). Gates every pull request.
#   2. Nightly    — full suite against a real device via a device provider.
#                   Slower/costlier, so it runs on a schedule, not per-PR.
#
# This file is illustrative: device-provider steps are schematic TODOs, and a
# real Unity batch-mode run needs a Unity license (see the UNITY_* secrets).

name: TestGoblin CI

on:
  pull_request: {}                 # tier 1: every PR
  schedule:
    - cron: "0 3 * * *"            # tier 2: nightly at 03:00 UTC
  workflow_dispatch:               # manual run, with a tier picker on the Actions page
    inputs:
      tier:
        description: "Which tier to run manually"
        type: choice
        options: [smoke, nightly, both]
        default: smoke

jobs:
  # ----------------------------------------------------------------------------
  # Tier 1 — PR smoke: Unity editor tests in batch mode.
  # ----------------------------------------------------------------------------
  pr-smoke:
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.tier == 'smoke' || github.event.inputs.tier == 'both'))
    runs-on: ubuntu-latest
    env:
      TESTGOBLIN_EXECUTION_TARGET: Editor      # -> FakeGameDriver / editor tests
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the Unity Library folder to avoid a full reimport every run.
      - uses: actions/cache@v4
        with:
          path: TestGoblin-Dev/Library
          key: Library-${{ hashFiles('TestGoblin-Dev/Packages/**') }}
          restore-keys: Library-

      # game-ci is the de-facto standard for Unity in CI. Runs EditMode +
      # PlayMode tests headless in batch mode.
      - name: Run Unity tests (batch mode)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}   # TODO: provide via repo secret
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestGoblin-Dev
          testMode: all
          artifactsPath: test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-results
          path: test-results

  # ----------------------------------------------------------------------------
  # Tier 2 — Nightly device run: full suite against a real device.
  # ----------------------------------------------------------------------------
  nightly-device:
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.tier == 'nightly' || github.event.inputs.tier == 'both'))
    runs-on: ubuntu-latest
    env:
      TESTGOBLIN_EXECUTION_TARGET: Device       # -> AltTesterGameDriver
      TESTGOBLIN_ENVIRONMENT_NAME: staging
      # Host/port/device id injected here rather than hardcoded in config.
      TESTGOBLIN_ALT_TESTER_HOST: ${{ secrets.ALT_TESTER_HOST }}
      TESTGOBLIN_ALT_TESTER_PORT: "13000"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # TODO: build the instrumented (AltTester-enabled) debug player.
      - name: Build instrumented debug player
        run: 'echo "TODO: game-ci/unity-builder build of the AltTester debug APK"'

      # TODO: hand the build to a device provider (BrowserStack / Firebase Test
      # Lab / self-hosted lab), boot it, forward the AltTester port, run tests
      # with TESTGOBLIN_EXECUTION_TARGET=Device.
      - name: Run suite on device provider
        run: 'echo "TODO: upload build + run NUnit/AltTester suite against a real device"'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-device-results
          path: test-results
